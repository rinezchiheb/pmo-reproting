<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>be-ivs · Paramètres</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 22'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238DD8F0'/%3E%3Cstop offset='1' stop-color='%2338BDF8'/%3E%3C/linearGradient%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236EE7A0'/%3E%3Cstop offset='1' stop-color='%2316A34A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='22' height='22' rx='5' fill='url(%23b)'/%3E%3Crect x='12' width='22' height='22' rx='5' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>
  <header class="topbar">
    <a class="brand" href="/recap" aria-label="be-ivs by heka · PMO Reporting">
      <span class="logo-mark" aria-hidden="true"><i class="d1"></i><i class="d2"></i></span>
      <span class="logo-text"><b>be-ivs</b><small>by heka</small></span>
      <span class="brand-sep" aria-hidden="true"></span>
      <span class="brand-name">PMO Reporting</span>
    </a>
    <nav class="tabs" aria-label="Vues">
      <a class="tab" href="/recap"><svg class="i tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3 7 4-14 3 7h4"/></svg><span class="tab-l">Synthèse</span><span class="tab-s">Synthèse</span></a>
      <a class="tab" href="/" data-pilotage title="Tâches, capacité, temps passé et effort"><svg class="i tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/></svg><span class="tab-l">Pilotage</span><span class="tab-s">Pilotage</span></a>
      <a class="tab active" href="/parametres" aria-current="page"><svg class="i tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span class="tab-l">Paramètres</span><span class="tab-s">Paramètres</span></a>
    </nav>
    <div class="sync">
      <span id="storage" class="badge"></span>
      <span id="updated" class="muted"></span>
    </div>
  </header>

  <main id="main" class="st-main">
    <h1 class="sr-only">Paramètres de l'outil</h1>
    <div id="banner" class="stale" role="status" hidden></div>
    <div class="st-layout">
      <nav class="st-nav" id="nav" aria-label="Sections des paramètres"></nav>
      <div class="st-content" id="content"></div>
    </div>
    <section class="panel" aria-labelledby="histTitle">
      <div class="panel-head"><h2 id="histTitle">Historique des modifications<small>Qui a changé quoi, et quand</small></h2><div class="panel-tools" id="histFilter"></div></div>
      <div id="history" class="st-history"></div>
    </section>
  </main>

  <!-- Barre d'enregistrement : visible dès qu'un paramètre est modifié -->
  <div class="st-save" id="saveBar" hidden>
    <div class="st-save-in">
      <div class="st-save-sum">
        <b id="dirtyCount"></b>
        <button type="button" class="btn quiet small" id="showDiff" aria-expanded="false">Voir le détail</button>
      </div>
      <label class="field st-who"><span>Votre nom</span><input id="who" type="text" autocomplete="name" placeholder="Nom de la personne qui enregistre"></label>
      <label class="field st-code"><span>Code administrateur</span><input id="code" type="password" autocomplete="off" placeholder="Code"></label>
      <button type="button" class="btn quiet" id="cancel">Annuler</button>
      <button type="button" class="btn primary" id="save">Enregistrer</button>
    </div>
    <div class="st-diff" id="diff" hidden></div>
    <p class="st-msg" id="saveMsg" role="alert" hidden></p>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="loading" class="loading">
    <div class="loading-card" id="loadingCard"><div class="spinner" aria-hidden="true"></div><span>Chargement des paramètres…</span></div>
  </div>
  <script src="/static/pilotage.js"></script>
  <script src="/static/glossaire.js"></script>
  <script src="/static/listfilter.js"></script>
  <script src="/static/parametres.js"></script>
</body>
</html>
